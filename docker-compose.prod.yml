# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    environment:
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    environment:
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    ports: []  # Don't expose DB externally in production

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    ports: []  # Don't expose Redis externally in production
